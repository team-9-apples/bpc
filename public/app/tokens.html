<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BizPartnerCheck – API tokens</title>
  <script src="/clerk.js"></script>
  <script src="/app-shell.js"></script>
</head>
<body>
  <!-- SCRUM-32: only Organisation Admins get this page (src/pages.js).
       Shows GET /api/tokens, which only returns the caller's own organisation.
       SCRUM-69: the form creates a token with POST /api/tokens. The full token
       is shown only here, right after creating it, and only kept in this page;
       the list shows just its name and prefix. -->
  <header id="app-header"></header>
  <main>
    <h1 id="title"></h1>

    <h2 id="form-title"></h2>
    <form id="token-form">
      <label><span data-text="user"></span> <select name="userId" required></select></label><br>
      <label><span data-text="name"></span> <input name="name" required maxlength="100" autocomplete="off"></label><br>
      <button type="submit" data-text="submit"></button>
    </form>
    <p id="message" role="status"></p>

    <section id="new-token" hidden>
      <p><strong data-text="onceWarning"></strong></p>
      <input id="new-token-value" readonly size="60" autocomplete="off" spellcheck="false">
      <button type="button" id="copy" data-text="copy"></button>
      <button type="button" id="done" data-text="done"></button>
    </section>

    <h2 id="list-title"></h2>
    <div id="content"></div>
  </main>

  <script>
    const { lang, t, start, showList } = appShell;
    const texts = {
      en: {
        formTitle: 'Create a token',
        listTitle: 'All tokens',
        user: 'Request User',
        name: 'Name',
        submit: 'Create token',
        noUsers: 'There are no Request Users yet. Add one on the Users page first.',
        created: (name) => `Token "${name}" created.`,
        onceWarning: 'Copy this token now. It is shown only this once and cannot be retrieved later.',
        copy: 'Copy',
        copied: 'Copied.',
        done: 'I have copied it',
        check: 'Please check',
        errors: { FORBIDDEN: 'Only Organisation Admins can create tokens.' },
      },
      de: {
        formTitle: 'Token erstellen',
        listTitle: 'Alle Tokens',
        user: 'Anfrage-Benutzer',
        name: 'Name',
        submit: 'Token erstellen',
        noUsers: 'Es gibt noch keine Anfrage-Benutzer. Legen Sie zuerst auf der Seite Benutzer einen an.',
        created: (name) => `Token „${name}“ erstellt.`,
        onceWarning: 'Kopieren Sie diesen Token jetzt. Er wird nur dieses eine Mal angezeigt und kann später nicht mehr abgerufen werden.',
        copy: 'Kopieren',
        copied: 'Kopiert.',
        done: 'Ich habe ihn kopiert',
        check: 'Bitte prüfen',
        errors: { FORBIDDEN: 'Nur Organisations-Admins können Tokens erstellen.' },
      },
    }[lang];

    document.getElementById('title').textContent = t.pages.tokens;
    document.getElementById('form-title').textContent = texts.formTitle;
    document.getElementById('list-title').textContent = texts.listTitle;
    for (const node of document.querySelectorAll('[data-text]')) node.textContent = texts[node.dataset.text];

    const form = document.getElementById('token-form');
    const message = document.getElementById('message');
    const content = document.getElementById('content');
    const newToken = document.getElementById('new-token');
    const newTokenValue = document.getElementById('new-token-value');
    const loadList = () => showList(content, '/api/tokens', 'tokens', null);

    // Only active or invited Request Users can get a token (FR-API-04).
    async function loadUsers() {
      const response = await fetch('/api/users').catch(() => null);
      const body = response?.ok ? await response.json() : { users: [] };
      const users = body.users.filter((u) => u.role === 'REQUEST_USER' && u.status !== 'DEACTIVATED');
      form.userId.replaceChildren(
        ...users.map((u) => appShell.el('option', { value: String(u.id), textContent: `${u.firstName} ${u.lastName} (${u.email})` })),
      );
      form.querySelector('button').disabled = users.length === 0;
      if (users.length === 0) message.textContent = texts.noUsers;
    }

    // Removes the full token from the page; after this it cannot be shown again.
    function hideToken() {
      newTokenValue.value = '';
      newToken.hidden = true;
    }

    start();
    loadUsers();
    loadList();

    document.getElementById('copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(newTokenValue.value);
        message.textContent = texts.copied;
      } catch {
        newTokenValue.select();
      }
    });
    document.getElementById('done').addEventListener('click', hideToken);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideToken();
      const button = form.querySelector('button');
      button.disabled = true;
      message.textContent = t.loading;
      const input = { userId: Number(form.userId.value), name: form.name.value };
      try {
        const response = await fetch('/api/tokens', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(input),
        });
        const body = await response.json().catch(() => ({}));
        if (response.ok) {
          message.textContent = texts.created(body.token.name);
          newTokenValue.value = body.secret;
          newToken.hidden = false;
          newTokenValue.select();
          form.name.value = '';
          loadList();
        } else if (body.fields) {
          message.textContent = `${texts.check}: ${Object.keys(body.fields).map((name) => texts[name === 'userId' ? 'user' : name] ?? name).join(', ')}`;
        } else {
          message.textContent = texts.errors[body.error] ?? t.error;
        }
      } catch {
        message.textContent = t.error;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
