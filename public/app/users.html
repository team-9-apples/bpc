<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BizPartnerCheck – Users</title>
  <script src="/clerk.js"></script>
  <script src="/app-shell.js"></script>
</head>
<body>
  <!-- SCRUM-32: only Organisation Admins get this page (src/pages.js).
       Shows GET /api/users, which only returns the caller's own organisation.
       SCRUM-35: the form creates a user with POST /api/users and Clerk sends the invitation. -->
  <header id="app-header"></header>
  <main>
    <h1 id="title">Users</h1>

    <h2 id="form-title">Add a user</h2>
    <form id="user-form">
      <label><span data-text="firstName"></span> <input name="firstName" required maxlength="200" autocomplete="off"></label><br>
      <label><span data-text="lastName"></span> <input name="lastName" required maxlength="200" autocomplete="off"></label><br>
      <label><span data-text="email"></span> <input name="email" type="email" required maxlength="254" autocomplete="off"></label><br>
      <label><span data-text="role"></span>
        <select name="role">
          <option value="REQUEST_USER"></option>
          <option value="REVIEW_USER"></option>
        </select>
      </label><br>
      <button type="submit" data-text="submit"></button>
    </form>
    <p id="message" role="status"></p>

    <h2 id="list-title">All users</h2>
    <div id="content"></div>
  </main>

  <script>
    const { lang, t, start, showList } = appShell;
    const texts = {
      en: {
        formTitle: 'Add a user',
        listTitle: 'All users',
        firstName: 'First name',
        lastName: 'Last name',
        email: 'E-mail',
        role: 'Role',
        submit: 'Create and send invitation',
        created: (email) => `User created. An invitation was sent to ${email}.`,
        check: 'Please check',
        errors: {
          FORBIDDEN: 'Only Organisation Admins can create users.',
          EMAIL_IN_USE: 'This e-mail address already has an account.',
          INVITE_FAILED: 'The invitation could not be sent. Please try again.',
        },
      },
      de: {
        formTitle: 'Benutzer hinzufügen',
        listTitle: 'Alle Benutzer',
        firstName: 'Vorname',
        lastName: 'Nachname',
        email: 'E-Mail',
        role: 'Rolle',
        submit: 'Anlegen und Einladung senden',
        created: (email) => `Benutzer angelegt. Eine Einladung wurde an ${email} gesendet.`,
        check: 'Bitte prüfen',
        errors: {
          FORBIDDEN: 'Nur Organisations-Admins können Benutzer anlegen.',
          EMAIL_IN_USE: 'Für diese E-Mail-Adresse gibt es bereits ein Konto.',
          INVITE_FAILED: 'Die Einladung konnte nicht gesendet werden. Bitte versuchen Sie es erneut.',
        },
      },
    }[lang];

    document.getElementById('title').textContent = t.pages.users;
    document.getElementById('form-title').textContent = texts.formTitle;
    document.getElementById('list-title').textContent = texts.listTitle;
    for (const node of document.querySelectorAll('[data-text]')) node.textContent = texts[node.dataset.text];

    const form = document.getElementById('user-form');
    for (const option of form.role.options) option.textContent = t.roles[option.value];
    const message = document.getElementById('message');
    const content = document.getElementById('content');
    const loadList = () => showList(content, '/api/users', 'users');

    start();
    loadList();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      message.textContent = t.loading;
      const input = Object.fromEntries(new FormData(form));
      try {
        const response = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(input),
        });
        const body = await response.json().catch(() => ({}));
        if (response.ok) {
          message.textContent = texts.created(body.user.email);
          form.reset();
          loadList();
        } else if (body.fields) {
          message.textContent = `${texts.check}: ${Object.keys(body.fields).map((name) => texts[name] ?? name).join(', ')}`;
        } else {
          message.textContent = texts.errors[body.error] ?? t.error;
        }
      } catch {
        message.textContent = t.error;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
