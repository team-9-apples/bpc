<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BizPartnerCheck – Request details</title>
  <script src="/clerk.js"></script>
  <script src="/app-shell.js"></script>
</head>
<body>
  <!-- SCRUM-32: only Review Users and Organisation Admins get this page (src/pages.js).
       Shows GET /api/requests/<id>; an ID of another organisation is 404 there. -->
  <header id="app-header"></header>
  <main>
    <h1 id="title"></h1>
    <p><a id="back" href="/app/requests.html"></a></p>
    <div id="content"></div>
  </main>

  <script>
    const { t, el, start, showItem } = appShell;
    document.getElementById('title').textContent = t.pages.request;
    document.getElementById('back').textContent = t.back;
    start();
    const content = document.getElementById('content');
    const id = new URLSearchParams(location.search).get('id');
    if (id) showItem(content, `/api/requests/${encodeURIComponent(id)}`, 'request');
    else content.replaceChildren(el('p', { textContent: t.notFound }));
  </script>
</body>
</html>
