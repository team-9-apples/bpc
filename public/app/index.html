<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BizPartnerCheck</title>
  <script src="/clerk.js"></script>
  <script src="/app-shell.js"></script>
</head>
<body>
  <!-- SCRUM-14: first page after login. The Worker only serves /app/* to signed-in
       users. SCRUM-32: lists the pages the user's role may open; a page the role
       may not open redirects here with ?forbidden. -->
  <header id="app-header"></header>
  <main>
    <h1>BizPartnerCheck</h1>
    <p id="notice" role="alert"></p>
    <ul id="pages"></ul>
  </main>

  <script>
    const { t, el, start } = appShell;
    if (new URLSearchParams(location.search).has('forbidden')) {
      document.getElementById('notice').textContent = t.forbidden;
    }
    start().then(({ user, pages }) => {
      if (!user) return; // the header already says the account is not registered
      const list = document.getElementById('pages');
      if (!pages.length) return list.replaceWith(el('p', { textContent: t.noPages }));
      list.replaceChildren(...pages.map((page) =>
        el('li', {}, [el('a', { href: page.path, textContent: t.pages[page.name] ?? page.name })])));
    });
  </script>
</body>
</html>
